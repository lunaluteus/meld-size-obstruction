name: Verify proofs and certificates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build Lean library
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: true
          build-args: --iofail
          use-mathlib-cache: true
      - name: Check examples and public theorem interfaces
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Enforce the axiom allowlist throughout the library
        run: bash scripts/audit-axioms.sh
      - name: Reconstruct winning certificates
        run: python3 -m unittest -v
